<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Options preview</title>
    <link rel="stylesheet" href="../_preview/sandustry.css" />
  </head>
  <body class="preview-page">
    <div class="preview-block">
      <p class="preview-label">OptionsPanel</p>
      <div
        data-ui-preview="OptionsPanel"
        class="max-w-lg mx-auto px-1 bg-black/90 p-5 ui-box card-2 shadow-lg"
      >
        <section>
          <div class="pb-1 pt-0">
            <span class="text-xs font-bold uppercase tracking-widest text-[#ffe700]">Interface</span>
          </div>
          <div class="flex items-center justify-between py-2">
            <div class="flex flex-col mr-4">
              <span class="text-sm font-medium text-slate-200">Language</span>
            </div>
            <div class="flex items-center shrink-0">
              <div class="relative">
                <button
                  type="button"
                  aria-haspopup="listbox"
                  aria-expanded="false"
                  class="w-full flex items-center justify-between gap-2 px-3 py-1.5 text-sm bg-black/40 border rounded-tr-lg rounded-bl-lg transition-colors text-slate-200 border-slate-700 hover:border-slate-500 cursor-pointer"
                >
                  <span class="whitespace-nowrap">Auto-detect (en)</span>
                  <svg class="w-3 h-3 shrink-0 transition-transform duration-150 text-slate-400" viewBox="0 0 12 12" fill="none">
                    <path
                      d="M2.5 4.5L6 8l3.5-3.5"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div>
            <div class="flex items-center justify-between py-2">
              <span class="text-sm font-medium text-slate-200 mr-4">UI Scale</span>
              <div class="flex items-center gap-3">
                <input type="range" min="50" max="150" class="options-slider w-40" value="100" />
                <span class="text-sm font-medium text-slate-300 w-10 text-right tabular-nums">100%</span>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <div class="preview-block">
      <p class="preview-label">OptionsSection</p>
      <div data-ui-preview="OptionsSection" class="max-w-lg px-1 bg-black/90 p-5 ui-box card-2 shadow-lg">
        <section>
          <div class="pb-1 pt-3 mt-1 border-t border-slate-800/50">
            <span class="text-xs font-bold uppercase tracking-widest text-[#ffe700]">Gameplay</span>
          </div>
          <p class="text-xs text-slate-300 -mt-1 mb-1">Section description line.</p>
        </section>
      </div>
    </div>

    <div class="preview-block">
      <p class="preview-label">OptionsRow</p>
      <div data-ui-preview="OptionsRow" class="max-w-lg px-1 bg-black/90 p-5 ui-box card-2 shadow-lg">
        <div class="flex items-center justify-between py-2">
          <div class="flex flex-col mr-4">
            <span class="text-sm font-medium text-slate-200">Hotbars</span>
            <span class="text-xs text-slate-300 mt-0.5"
              >Number of hotbar banks you can switch between.</span
            >
          </div>
          <div class="flex items-center shrink-0">
            <input
              type="number"
              min="1"
              max="10"
              value="5"
              class="w-16 px-2 py-1.5 text-sm text-center bg-black/40 text-slate-200 border border-slate-700 rounded-tr-lg rounded-bl-lg focus:border-[#ffe700] focus:outline-none transition-colors"
            />
          </div>
        </div>
      </div>
    </div>

    <div class="preview-block">
      <p class="preview-label">OptionsSelect</p>
      <div data-ui-preview="OptionsSelect" class="bg-black/90 p-5 ui-box card-2 shadow-lg">
        <div class="relative">
          <button
            type="button"
            class="w-full flex items-center justify-between gap-2 px-3 py-1.5 text-sm bg-black/40 border rounded-tr-lg rounded-bl-lg transition-colors text-slate-200 border-slate-700 hover:border-slate-500 cursor-pointer"
          >
            <span class="whitespace-nowrap">Auto-detect (en)</span>
            <svg class="w-3 h-3 shrink-0 transition-transform duration-150 text-slate-400" viewBox="0 0 12 12" fill="none">
              <path
                d="M2.5 4.5L6 8l3.5-3.5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="preview-block">
      <p class="preview-label">OptionsSliderRow</p>
      <div data-ui-preview="OptionsSliderRow" class="max-w-lg px-1 bg-black/90 p-5 ui-box card-2 shadow-lg">
        <div>
          <div class="flex items-center justify-between py-2">
            <span class="text-sm font-medium text-slate-200 mr-4">UI Scale</span>
            <div class="flex items-center gap-3">
              <input type="range" min="50" max="150" class="options-slider w-40" value="100" />
              <span class="text-sm font-medium text-slate-300 w-10 text-right tabular-nums">100%</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="preview-block">
      <p class="preview-label">OptionsSlider</p>
      <div data-ui-preview="OptionsSlider" class="bg-black/90 p-5 ui-box card-2 shadow-lg">
        <input type="range" min="50" max="150" class="options-slider w-40" value="75" />
      </div>
    </div>

    <div class="preview-block">
      <p class="preview-label">OptionsNumberInput</p>
      <div data-ui-preview="OptionsNumberInput" class="bg-black/90 p-5 ui-box card-2 shadow-lg">
        <input
          type="number"
          min="1"
          max="10"
          value="5"
          class="w-16 px-2 py-1.5 text-sm text-center bg-black/40 text-slate-200 border border-slate-700 rounded-tr-lg rounded-bl-lg focus:border-[#ffe700] focus:outline-none transition-colors"
        />
      </div>
    </div>

    <div class="preview-block">
      <p class="preview-label">OptionsSwitch</p>
      <div data-ui-preview="OptionsSwitch" class="bg-black/90 p-5 ui-box card-2 shadow-lg">
        <div class="flex items-center gap-4">
          <div
            role="switch"
            aria-checked="false"
            class="relative inline-flex items-center cursor-pointer w-10 h-[22px] rounded-full transition-colors duration-200 bg-slate-700 after:content-[''] after:absolute after:top-[3px] after:left-[3px] after:rounded-full after:h-4 after:w-4 after:transition-all after:duration-200 after:shadow-sm after:bg-white"
          ></div>
          <div
            role="switch"
            aria-checked="true"
            class="relative inline-flex items-center cursor-pointer w-10 h-[22px] rounded-full transition-colors duration-200 bg-[#ffe700] after:content-[''] after:absolute after:top-[3px] after:left-[3px] after:rounded-full after:h-4 after:w-4 after:transition-all after:duration-200 after:shadow-sm after:bg-white after:translate-x-[18px]"
          ></div>
        </div>
      </div>
    </div>

    <div class="preview-block">
      <p class="preview-label">OptionsButton</p>
      <div data-ui-preview="OptionsButton" class="bg-black/90 p-5 ui-box card-2 shadow-lg">
        <button
          type="button"
          class="px-3 py-1.5 text-sm bg-black/40 border border-slate-700 rounded-tr-lg rounded-bl-lg text-slate-300 hover:text-[#ffe700] hover:border-slate-500 transition-all duration-200"
        >
          Hide UI
        </button>
      </div>
    </div>
    <script src="../_preview/embed.js"></script>
  </body>
</html>
