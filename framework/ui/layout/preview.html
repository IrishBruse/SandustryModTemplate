<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Layout preview</title>
    <link rel="stylesheet" href="../_preview/sandustry.css" />
    <style>
      .layout-demo {
        position: relative;
        width: 320px;
        height: 180px;
        border: 1px dashed rgba(148, 163, 184, 0.35);
        border-radius: 8px;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="preview-page">
    <div class="preview-block">
      <p class="preview-label">FixedAnchor + Interactive</p>
      <div data-ui-preview="FixedAnchor" class="layout-demo">
        <div
          style="
            position: absolute;
            bottom: 1rem;
            left: 0;
            right: 0;
            margin-inline: auto;
            width: fit-content;
          "
        >
          <div
            class="pointer-events-auto bg-black-75 border border-slate-700 rounded ui-box px-2 py-1 text-white text-xs"
          >
            Bottom-center anchor
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
