<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Panels preview</title>
    <link rel="stylesheet" href="../_preview/sandustry.css" />
  </head>
  <body class="preview-page">
    <div class="preview-block">
      <p class="preview-label">InfoBanner</p>
      <div
        data-ui-preview="InfoBanner"
        class="bg-black/75 border border-slate-700 rounded ui-box px-2 py-1 text-white text-xs flex items-center gap-2"
      >
        <span class="opacity-70">Next Console Game: </span>
        <span class="font-bold text-[#ffe700]">Snake</span>
        <button class="ml-2 px-2 py-0.5 bg-slate-700 rounded border border-slate-700">
          Switch
        </button>
      </div>
    </div>

    <div class="preview-block">
      <p class="preview-label">UiBox</p>
      <div
        data-ui-preview="UiBox"
        class="ui-box bg-black/75 border border-slate-800 rounded px-3 py-2 text-white text-sm"
      >
        Generic ui-box panel
      </div>
    </div>

    <div class="preview-block">
      <p class="preview-label">PanelCard</p>
      <div
        data-ui-preview="PanelCard"
        class="pointer-events-auto px-3 py-2 rounded-tr-lg rounded-bl-lg bg-black/75 ui-box border border-slate-800 w-[200px]"
      >
        <div class="flex flex-col gap-1">
          <span class="text-sm text-gray-400">Viability</span>
          <span class="text-[10px] text-[#ffe700]/60 uppercase tracking-wider">Max Level</span>
        </div>
      </div>
    </div>
    <script src="../_preview/embed.js"></script>
  </body>
</html>
