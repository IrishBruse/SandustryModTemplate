<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shortcuts preview</title>
    <link rel="stylesheet" href="../_preview/sandustry.css" />
  </head>
  <body class="preview-page">
    <div class="preview-block">
      <p class="preview-label">ShortcutBar</p>
      <div
        data-ui-preview="ShortcutBar"
        class="flex items-center gap-4 bg-black/30 p-2 rounded text-sm text-white border border-white/5 shadow-lg"
      >
        <div class="flex items-center gap-2 text-gray-200">
          <span
            class="hotkey-badge inline-flex items-center justify-center min-w-[1.75rem] h-7 px-2 text-sm font-bold rounded"
            >Ctrl</span
          >
          <span class="opacity-50">+</span>
          <span
            class="hotkey-badge inline-flex items-center justify-center min-w-[1.75rem] h-7 px-2 text-sm font-bold rounded"
            >Z</span
          >
          <span>Undo</span>
        </div>
        <div class="w-px h-4 bg-white/10"></div>
        <div class="flex items-center gap-2 text-yellow-200">
          <span
            class="hotkey-badge inline-flex items-center justify-center min-w-[1.75rem] h-7 px-2 text-sm font-bold rounded"
            >Space</span
          >
          <span class="font-medium">Hover</span>
          <div
            class="w-1.5 h-1.5 rounded-full bg-[#ffe700] shadow-[0_0_5px_rgba(255,231,0,0.8)] animate-pulse"
          ></div>
        </div>
      </div>
    </div>

    <div class="preview-block">
      <p class="preview-label">ShortcutChip</p>
      <div
        data-ui-preview="ShortcutChip"
        class="flex flex-col items-center gap-1 p-1.5 rounded text-xs border bg-black/30 text-white border-white/5"
      >
        <span
          class="hotkey-badge inline-flex items-center justify-center min-w-[1.75rem] h-7 px-2 text-sm font-bold rounded"
          >E</span
        >
        <span class="opacity-75">Radial</span>
      </div>
    </div>

    <div class="preview-block">
      <p class="preview-label">ShortcutBarItem</p>
      <div
        data-ui-preview="ShortcutBarItem"
        class="flex items-center gap-2 text-gray-200 bg-black/30 p-2 rounded"
      >
        <span
          class="hotkey-badge inline-flex items-center justify-center min-w-[1.75rem] h-7 px-2 text-sm font-bold rounded"
          >Q</span
        >
        <span>Grab</span>
      </div>
    </div>

    <div class="preview-block">
      <p class="preview-label">ShortcutBarDivider</p>
      <div
        data-ui-preview="ShortcutBarDivider"
        class="flex items-center bg-black/30 p-2 rounded h-7"
      >
        <div class="w-px h-4 bg-white/10"></div>
      </div>
    </div>

    <div class="preview-block">
      <p class="preview-label">CompoundHotkeys</p>
      <div data-ui-preview="CompoundHotkeys" class="flex items-center gap-1">
        <span
          class="hotkey-badge inline-flex items-center justify-center min-w-[1.75rem] h-7 px-2 text-sm font-bold rounded"
          >Ctrl</span
        >
        <span class="opacity-50">+</span>
        <span
          class="hotkey-badge inline-flex items-center justify-center min-w-[1.75rem] h-7 px-2 text-sm font-bold rounded"
          >Shift</span
        >
        <span class="opacity-50">+</span>
        <span
          class="hotkey-badge inline-flex items-center justify-center min-w-[1.75rem] h-7 px-2 text-sm font-bold rounded"
          >S</span
        >
      </div>
    </div>
    <script src="../_preview/embed.js"></script>
  </body>
</html>
