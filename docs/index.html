<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sandustry Mod Template Docs</title>
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Unofficial community docs for the Sandustry Mod Template. Not affiliated with Lantto Games or Hooded Horse."
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/core.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/themes/addons/core-dark.min.css"
    />
    <link rel="stylesheet" href="assets/theme.css" />
    <link rel="stylesheet" href="assets/site.css" />
    <script src="assets/heading-anchor.js"></script>
    <script src="assets/page-toc.js"></script>
    <script src="assets/ui-canvas.js"></script>
    <script src="assets/api-sidebar-name.js"></script>
    <script src="assets/search-rank.js"></script>
    <script src="assets/search-paths.js"></script>
    <script>
      if (localStorage.getItem("smt-unofficial-banner-dismissed") === "1") {
        document.documentElement.classList.add("banner-dismissed-pending");
      }
    </script>
  </head>
  <body class="loading">
    <div class="unofficial-banner" id="unofficial-banner" role="note">
      <p class="unofficial-banner__text">
        <strong>Unofficial</strong> community docs. Not affiliated with Lantto Games,
        Hooded Horse, or the
        <a href="https://wiki.hoodedhorse.com/Sandustry/Sandustry_Official_Wiki"
          >official Sandustry wiki</a
        >. See the
        <a href="https://sandustry.com/sandkit.html" target="_blank" rel="noopener"
          >official Sandkit docs</a
        >.
      </p>
      <span
        class="unofficial-banner__dismiss"
        id="unofficial-banner-dismiss"
        role="button"
        tabindex="0"
        aria-label="Dismiss unofficial notice"
      >×</span>
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var key = "smt-unofficial-banner-dismissed";
        var banner = document.getElementById("unofficial-banner");
        var dismiss = document.getElementById("unofficial-banner-dismiss");
        if (!banner || !dismiss) return;

        function hideBanner() {
          document.documentElement.classList.remove("banner-dismissed-pending");
          document.body.classList.add("banner-dismissed");
          banner.hidden = true;
        }

        if (localStorage.getItem(key) === "1") {
          hideBanner();
        }

        dismiss.addEventListener("click", function () {
          localStorage.setItem(key, "1");
          hideBanner();
        });
        dismiss.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            localStorage.setItem(key, "1");
            hideBanner();
          }
        });
      })();
    </script>
    <script>
      window.$docsify = {
        name: "Sandustry Mod Template",
        loadSidebar: true,
        subMaxLevel: 0,
        auto2top: true,
        alias: {
          "/docs/(.*)": "/$1",
          "/hot-reload/": "/hot-reload/README.md",
          "/modkit/": "/modkit/README.md",
          "/api/.*/_sidebar.md": "/api/_sidebar.md",
          "/ui/gallery": "/ui/",
          "ui/gallery.md": "ui/README.md",
        },
        search: {
          paths: Array.isArray(window.SMT_SEARCH_PATHS) ? window.SMT_SEARCH_PATHS : "auto",
          placeholder: "Search docs and API (e.g. sandkit.api.ui)",
          noData: "No results",
          depth: 4,
          namespace: "smt-docs-api-v3",
        },
        plugins: [
          window.smtDocsifyHeadingCopyPlugin,
          window.smtDocsifyPageTocPlugin,
          window.smtDocsifyUiCanvasPlugin,
          window.smtDocsifyApiSidebarNamePlugin,
          window.smtDocsifySearchRankPlugin,
        ].filter(function (p) {
          return typeof p === "function";
        }),
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@5.0.0/dist/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
  </body>
</html>
